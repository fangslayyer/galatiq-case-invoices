[project]
name = "invoiceflow"
version = "0.1.0"
description = "Multi-agent invoice processing pipeline (Galatiq case): ingestion, validation, approval, payment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.16",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "streamlit>=1.62.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    # LangSmith trace viewer client — DEVELOPMENT ONLY. The case allows no
    # external API beyond Grok, so tracing is opt-in per debugging session
    # (LANGSMITH_TRACING=true) and never fires in a normal run: see
    # config.tracing_enabled() and tests/__init__.py. langchain-core pulls the
    # package in transitively regardless; declaring it here pins the version and
    # marks it as ours for development, not part of the shipping pipeline.
    "langsmith>=0.11.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call the real xAI API (require XAI_API_KEY); deselected by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
# The case brief is provided material, not our source — never reformat it.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's Option-in-default is the framework's own idiom
"src/invoiceflow/cli.py" = ["B008"]

[tool.pyright]
include = ["src", "tests", "ui", "main.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
# LangGraph state is partial by construction: nodes return only the keys they
# change, so PipelineState stays total=False. Which keys are populated at a
# given node is guaranteed by the graph's topology (the routing functions in
# graph.py), which no type checker can see. The keys the runner always supplies
# are marked Required in state.py; the rest are checked by the tests instead.
reportTypedDictNotRequiredAccess = "none"
